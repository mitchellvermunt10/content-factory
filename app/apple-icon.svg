<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="hsl(252 95% 73%)" stop-opacity="0.95"/>
      <stop offset="1" stop-color="hsl(252 95% 73%)" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <!-- iOS rondt zelf de hoeken af; we vullen vierkant -->
  <rect width="180" height="180" fill="hsl(240 6% 10%)"/>
  <rect x="14" y="14" width="152" height="152" rx="22" fill="url(#grad)"/>
  <text x="90" y="120" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="700" font-size="76" text-anchor="middle" fill="hsl(240 6% 4%)" letter-spacing="-3">AI</text>
</svg>
